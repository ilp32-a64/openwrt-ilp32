# AArch64 ILP32 OpenWrt defaults: libgcc/libstdc++ runtime (no compiler-rt, libunwind or libc++ for
# ILP32), GNU ld (lld has no AArch64 ILP32), no FMA contraction (as GCC with -std=c*), no outline
# atomics (the CPUs have no LSE)
--rtlib=libgcc
--unwindlib=libgcc
-fuse-ld=bfd
-ffp-contract=off
-mno-outline-atomics
