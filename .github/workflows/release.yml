name: Release

# Build, test and draft an OpenWrt-ILP32 release (armsr/armv8, devices of mediatek/filogic, Raspberry Pi 3-5).
# Manual only. Each target is built in its own job; the QEMU checks run on armsr/armv8. Two human gates: the release
# job waits for approval in the "release" environment, and the Release it creates is a draft that is
# published by hand.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "ilp32-25.12 commit to release (full SHA)"
        required: true
        type: string
      version:
        description: "Version, e.g. 25.12.6-ilp32.1 (tag v<version>)"
        required: true
        type: string
      test_ref:
        description: "test-ilp32 commit with build-release.sh and the QEMU tests (full SHA)"
        required: true
        type: string
        default: "TEST_ILP32_SHA"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [armsr-armv8, mediatek-filogic, bcm27xx-bcm2710, bcm27xx-bcm2711, bcm27xx-bcm2712]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check the inputs
        env:
          COMMIT: ${{ inputs.commit }}
          VERSION: ${{ inputs.version }}
          TEST_REF: ${{ inputs.test_ref }}
        run: |
          echo "$COMMIT" | grep -qxE '[0-9a-f]{40}' || { echo "commit must be a full SHA"; exit 1; }
          echo "$TEST_REF" | grep -qxE '[0-9a-f]{40}' || { echo "test_ref must be a full SHA"; exit 1; }
          echo "$VERSION" | grep -qxE '[0-9]+\.[0-9]+\.[0-9]+-ilp32\.[0-9]+(-test[0-9]*)?' ||
            { echo "version must look like 25.12.6-ilp32.1 (or ...-test for a dry run)"; exit 1; }

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - name: Install the build packages
        # OpenWrt 25.12 build prerequisites on Ubuntu 24.04, plus bc, cpio, libelf-dev, quilt and zstd
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            bc bison build-essential bzip2 ca-certificates clang cpio curl file \
            flex g++ g++-multilib gawk gcc-multilib gettext git gzip \
            libelf-dev libncurses-dev libssl-dev patch perl \
            python3 python3-dev python3-setuptools quilt rsync swig time \
            unzip wget xz-utils zlib1g-dev zstd > /dev/null

      - name: Check out openwrt-ilp32
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ilp32-25.12
          fetch-depth: 200
          path: openwrt
          persist-credentials: false

      - name: Check that the commit is on ilp32-25.12
        working-directory: openwrt
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          git merge-base --is-ancestor "$COMMIT" HEAD ||
            { echo "$COMMIT is not on ilp32-25.12"; exit 1; }
          git checkout -q --detach "$COMMIT"
          git log -1 --format='%H %s'

      - name: Check out test-ilp32
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ilp32-a64/test-ilp32
          ref: ${{ inputs.test_ref }}
          path: test-ilp32
          persist-credentials: false

      - name: Build
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: JOBS=$(nproc) test-ilp32/openwrt/build-release.sh openwrt "$VERSION" out "$TARGET"

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/release/openwrt-*
            out/release/sha256sums-*

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: out/release/
          retention-days: 14

      - name: Upload the test programs
        if: matrix.target == 'armsr-armv8'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests
          path: |
            out/tests/extra.cpio
            out/tests/extra-notime32.cpio
          retention-days: 14

      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs-${{ matrix.target }}
          path: out/*.log
          retention-days: 14
          if-no-files-found: ignore

  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-arm ipxe-qemu python3-pexpect > /dev/null
          qemu-system-aarch64 --version | head -1

      - name: Check out test-ilp32
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ilp32-a64/test-ilp32
          ref: ${{ inputs.test_ref }}
          path: test-ilp32
          persist-credentials: false

      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-armsr-armv8
          path: release

      - name: Download the test programs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tests
          path: tests

      - name: Check the files
        working-directory: release
        run: sha256sum -c sha256sums-armsr-armv8

      - name: QEMU checks (cortex-a53 and max, NOTIME32 0 and 1)
        run: |
          mkdir -p results
          KERNEL=$PWD/$(ls release/*-initramfs-kernel.bin) PREBUILT=$PWD/tests OUTBASE=$PWD/results \
            test-ilp32/openwrt/run-armsr-matrix.sh

      - name: Upload the test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs
          path: results/
          retention-days: 14
          if-no-files-found: ignore

  release:
    needs: [build, test]
    # a dry run (version ...-test) never tags or creates a Release, even if approved by mistake
    if: ${{ !contains(inputs.version, '-test') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Tag and draft the Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ inputs.commit }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          TAG=v$VERSION
          TITLE="OpenWrt-ILP32 $VERSION (experimental)"
          # one sha256sums for all targets; the per-target lists and public-info files are not published
          cd release
          for s in sha256sums-*; do sha256sum -c "$s"; done
          cat sha256sums-* > sha256sums
          rm sha256sums-* ./*public-info.txt
          cd ..
          # annotated tag on the released commit
          obj=$(gh api "repos/$REPO/git/tags" -f tag="$TAG" -f message="$TITLE" -f object="$COMMIT" \
                -f type=commit --jq .sha)
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$obj" > /dev/null
          gh release create "$TAG" --repo "$REPO" --verify-tag --draft --prerelease --title "$TITLE" \
            --notes "Release notes to follow. Commit $COMMIT." \
            release/*
